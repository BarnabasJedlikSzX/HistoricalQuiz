name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

  workflow_dispatch: 

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Docker Login
      uses: docker/login-action@v4.8.0
      with:
        registry: ghcr.io
        username: barnabasjedlikszx
        password: ${{ secrets.GHCR_TOKEN }}
    
    - name: Build the Docker images
      run: |
        VERSION=$(date +%s)
        docker build ./backend -t ghcr.io/barnabasjedlikszx/quiz-backend:$VERSION
        docker build ./frontend -t ghcr.io/barnabasjedlikszx/quiz-frontend:$VERSION
        docker push ghcr.io/barnabasjedlikszx/quiz-backend:$VERSION
        docker push ghcr.io/barnabasjedlikszx/quiz-frontend:$VERSION
